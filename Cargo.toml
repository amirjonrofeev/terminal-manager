[workspace]
resolver = "3"
members = ["crates/tm-core", "crates/tm-host", "crates/terminal-manager"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tm-core = { path = "crates/tm-core" }
tm-host = { path = "crates/tm-host" }
alacritty_terminal = "0.26"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
eframe = "0.37"
egui = "0.37"
interprocess = "2.4.7"
log = { version = "0.4", features = ["std"] }
polling = "3.8"
postcard = { version = "1.1.3", features = ["use-std"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
