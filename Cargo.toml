[package]
name = "terminal-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26"
directories = "6.0.0"
eframe = "0.37"
egui = "0.37"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
